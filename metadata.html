<!-- ## 14. Metadata -->
<!-- Metadata helps browsers, search engines, and social platforms interpret a document. -->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="A concise description of this page.">
    <link rel="icon" href="/favicon.svg">
    <meta property="og:title" content="Page title">
    <meta property="og:description" content="Share description">
    <meta property="og:type" content="website">
    <title>Page title</title>
</head>

<body>
</body>

</html>

<!-- **Example:** A recipe page has a unique title and description and shares a useful preview on social media. -->

<!-- **Use / do not use:** Use accurate descriptions and one meaningful title per page. Treat `keywords` as historical and -->
<!-- low-value; do not stuff metadata with repeated terms. Add a canonical URL when duplicate URLs are possible. -->
